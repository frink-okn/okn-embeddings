[project]
name = "okn-embeddings"
version = "0.1.0"
description = "Utilities to create, browse, and search embeddings from the OKN graph"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Patrick Golden", email = "ptgolden@email.unc.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=6.2.4",
    "fastembed>=0.8.0",
    "flask>=3.1.2",
    "gunicorn>=23.0.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "numpy>=2.3.4",
    "pyarrow>=23.0.1",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.12.0",
    "pyparsing<3.3",
    "qdrant-client>=1.17.0",
    "rdflib>=7.5.0",
    "rdflib-hdt>=3.2",
    "tqdm>=4.67.3",
    "typer>=0.21.1",
    "usearch>=2.26.0",
]

[project.scripts]
okn-indexing = "okn_embeddings.indexing.cli:app"
okn-search = "okn_embeddings.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Install the evaluation group by default, so a source checkout gets a working
# environment from a plain `uv sync` without needing extra flags.
default-groups = ["dev", "evaluation"]

[tool.uv.sources]
# Switch back to PyPI once a new release of rdflib-hdt lands in pypi that
# contains the fixes from https://github.com/RDFLib/rdflib-hdt/pull/39/
rdflib-hdt = { git = "https://github.com/RDFLib/rdflib-hdt.git", rev = "5b0a028fbd71e95befeadcf2fecaddb9542578ed" }

[tool.hatch.build.targets.wheel]
packages = ["src/okn_embeddings"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.1",
]

# Only the evaluation code needs pandas, and it is only ever run from a source
# checkout. Keeping it in a group rather than [project.dependencies] means
# consumers installing this package do not pull it in. (pyarrow moved to the
# main dependencies when `embed` started writing Parquet artifacts.)
evaluation = [
    "pandas>=3.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 80
include = [
    "src/**/*.py",
]

[tool.ruff.lint]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Select or ignore from https://beta.ruff.rs/docs/rules/
select = [
    "B",  # bugbear
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "S",  # flake8-bandit
    "W",  # Warning
]

extend-ignore = [
    "S101",  # `assert`
]
unfixable = []
